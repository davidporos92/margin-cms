services:
  api:
    build:
      context: ./
      dockerfile: ./infra/api/Dockerfile
    container_name: api
    ports:
      - '8080:8080'
    networks:
      - margin-cms-network
    volumes:
      - ./api:/app
      - api-go-mod:/go/pkg/mod
      - api-air-cache:/root/.cache/go-build

  apidocs:
    build:
      context: ./
      dockerfile: infra/openapi/Dockerfile
    container_name: apidocs
    ports:
      - 8081:8081
    networks:
      - margin-cms-network
    volumes:
      - ./openapi:/app/openapi

  apimock:
    build:
      context: ./
      dockerfile: infra/openapi/Dockerfile
    container_name: apimock
    ports:
      - 8082:8082
    networks:
      - margin-cms-network
    volumes:
      - ./openapi:/app/openapi
    command:
      - "npm"
      - "run"
      - "spec:mock"

networks:
  margin-cms-network:

volumes:
  api-air-cache:
  api-go-mod: