openapi: 3.0.3
info:
  title: MarginCMS API
  version: 0.1.0
  description: |
    Contract between the Go backend (`/api`) and the React frontend (`/web`).
    Name: MarginCMS. This file is the single source of truth. Change it first,
    in its own PR, approved by both sides, and only then change code.

    Conventions
    - JSON everywhere, camelCase fields, RFC 3339 UTC timestamps.
    - Errors are RFC 9457 `application/problem+json`.
    - Optimistic concurrency: every Post has an integer `version`, returned as the
      `ETag` header (`"7"`). `PATCH` and `DELETE` need `If-Match`. A stale version
      returns 412 with the current post in `extensions.current`.
    - Lists use cursor pagination (`limit`, `cursor`, response `nextCursor`).
    - Auth is a short-lived JWT access token sent as `Authorization: Bearer <token>`.
      `/auth/login` returns it together with a single-use refresh token.
      `/auth/refresh` swaps a refresh token for a new pair, and `/auth/logout`
      revokes one. On a 401 from any other endpoint, refresh once and retry the
      request. No cookies are involved, so CSRF protection is not needed.
servers:
- url: http://localhost:8080/api/v1
  description: Local backend (the Vite dev server proxies /api here)
- url: http://localhost:4010
  description: Prism mock server (`prism mock dist/openapi.bundled.yaml`)
tags:
- name: auth
  description: Login, token refresh and logout
- name: posts
  description: Posts, bulk actions, revisions and export
- name: tags
  description: Tag usage counts
- name: activity
  description: Audit trail of changes
- name: stats
  description: Numbers for the dashboard home
- name: meta
  description: Service health
security:
- bearerAuth: []
paths:
  /healthz:
    $ref: ./paths/health.yaml
  /auth/login:
    $ref: ./paths/auth-login.yaml
  /auth/refresh:
    $ref: ./paths/auth-refresh.yaml
  /auth/logout:
    $ref: ./paths/auth-logout.yaml
  /auth/me:
    $ref: ./paths/auth-me.yaml
  /posts:
    $ref: ./paths/posts.yaml
  /posts/bulk:
    $ref: ./paths/posts-bulk.yaml
  /posts/{id}:
    $ref: ./paths/post.yaml
  /posts/{id}/revisions:
    $ref: ./paths/post-revisions.yaml
  /posts/{id}/revisions/{version}/restore:
    $ref: ./paths/post-revision-restore.yaml
  /posts/{id}/export:
    $ref: ./paths/post-export.yaml
  /tags:
    $ref: ./paths/tags.yaml
  /activity:
    $ref: ./paths/activity.yaml
  /stats:
    $ref: ./paths/stats.yaml
