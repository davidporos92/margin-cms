type: object
minProperties: 1
properties:
  title:
    type: string
    minLength: 1
    maxLength: 200
  slug:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  excerpt:
    type: string
    maxLength: 500
  body:
    type: string
  status:
    $ref: ./PostStatus.yaml
  tags:
    type: array
    items:
      type: string
