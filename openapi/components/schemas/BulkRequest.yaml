type: object
required:
- ids
- action
properties:
  ids:
    type: array
    minItems: 1
    maxItems: 200
    items:
      type: string
  action:
    type: string
    enum:
    - publish
    - unpublish
    - archive
    - delete
    - addTag
    - removeTag
  tag:
    type: string
    description: Required for `addTag` and `removeTag`.
